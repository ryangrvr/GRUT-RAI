[project]
name = "grut"
version = "2.8.0"
description = "Grand Responsive Universe Theory — A unified framework from the CTP effective action"
authors = [{name = "D. Ryan Grover", email = "dryangrover@gmail.com"}]
readme = "README.md"
license = {text = "See LICENSE"}
requires-python = ">=3.10,<3.15"
dependencies = [
    "numpy>=1.24,<3.0",
    "scipy>=1.10,<2.0",
    "flask>=2.3,<4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.30"]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "anthropic>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["grut*", "ui*"]
