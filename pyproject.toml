[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "grut-solver"
version = "1.0.0"
description = "GRUT: Universal response framework with zero-parameter gravitational decoherence predictions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "D. Ryan Grover", email = "dryangrover@gmail.com"},
]
keywords = ["quantum", "decoherence", "gravity", "physics", "theory-of-everything"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://zenodo.org/communities/grut"
Repository = "https://github.com/dryangrover/grut-solver"

[project.scripts]
grut = "grut_solver.cli:main"

[tool.setuptools.packages.find]
include = ["grut_solver*"]
