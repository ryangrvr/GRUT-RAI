<text x="160" y="334" text-anchor="middle" font-size="12" fill="#1a1a1a">(a) single pole</text>
<text x="160" y="350" text-anchor="middle" font-size="10" fill="#1a1a1a">the framework's conjecture — derived-pending, its lean recorded circular</text>
