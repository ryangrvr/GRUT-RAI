<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Helvetica,Arial,sans-serif">
<text x="480" y="22" text-anchor="middle" font-size="15" fill="#1a1a1a">Three candidate low-frequency structures — identical axes and amplitudes, schematic by declared intent</text>
<text x="480" y="40" text-anchor="middle" font-size="11" fill="#1a1a1a">the order is not a ranking; each panel carries its status in the register</text>
